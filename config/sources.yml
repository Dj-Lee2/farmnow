# 신호원(어댑터) 선언. license는 기본값이며, 농식품부 게시물은 원문에 찍힌 공공누리 마크를 우선한다.
# 본문 발췌는 공공누리 1·2유형·제한 없음일 때만 하고, 그 밖에는 제목·링크만 게시한다.
site:
  name: 팜나우
  tagline: 농업 공공데이터 속보
  timezone: Asia/Seoul
  keep_days: 14            # 타임라인에 유지할 일수
  surge_threshold_pct: 10  # [급변] 기준: 전일比 절대값 % 이상
  stale_minutes: 180       # 마지막 갱신 뒤 이 시간이 지나면 화면에 '갱신 지연' 표시
  base_url: "https://farmnow.tech"   # 배포 주소. 환경변수 SITE_BASE_URL·CI_PAGES_URL이 있으면 그 값을 쓴다

