      - {id: agri_income, title: 농업소득, tbl: DT_1EA1201, itm: "^농업소득$", want: ["^평균$"], survey: 농가경제조사}
      - {id: nonagri_income, title: 농외소득, tbl: DT_1EA1201, itm: "^농외소득$", want: ["^평균$"], survey: 농가경제조사}
