      - {id: farms, title: 농가 수, tbl: DT_1EA1011, itm: "^농가(?!인구)|농가수|가구", survey: 농림어업조사}
      - {id: farm_pop, title: 농가인구, tbl: DT_1EA1011, itm: "농가인구|인구", survey: 농림어업조사}
      - {id: area, title: 경지면적, tbl: DT_1EB001, itm: "면적|^계$|^합계$", survey: 농업면적조사}
      - {id: area_paddy, title: 논 면적, tbl: DT_1EB001, itm: "논|면적", want: ["^논"], survey: 농업면적조사}
      - {id: area_upland, title: 밭 면적, tbl: DT_1EB001, itm: "밭|면적", want: ["^밭"], survey: 농업면적조사}
      - {id: rice, title: 쌀 생산량, tbl: DT_1ET0021, itm: "생산량", want: ["^(미곡|쌀|논벼)"], survey: 농작물생산조사}
      # 농가경제·교역조건·가축·소비·생산비(홈 통계 카드 띠). se: Q는 분기 통계, periods는 받을 기간 수
