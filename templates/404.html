{% extends "base.html" %}
{% block title %}찾을 수 없음 — {{ site.name }}{% endblock %}
{% block content %}
<div class="wrap page"><div class="page-hd"><h1>페이지를 찾을 수 없습니다</h1></div>
 <p id="nf" data-keep="{{ site.keep_days }}">주소가 바뀌었거나 없어진 쪽입니다. <a href="./">홈으로 →</a></p></div>
<script>(function(){var p=location.pathname,e=document.getElementById('nf');if(!e)return;   // 주소 종류에 맞는 안내
 var m=/^\/n-/.test(p)?['보관 기간('+e.dataset.keep+'일)이 지난 소식일 수 있습니다. ','./news','소식 전체 보기 →']:/^\/s-/.test(p)?['지금은 다루지 않는 종목입니다. ','./stocks','국제·증시 전체 보기 →']:/^\/stats/.test(p)?['없어진 통계 쪽입니다. ','./stats','농업 통계에서 찾기 →']:null;
 if(!m)return;e.firstChild.textContent=m[0];var a=e.querySelector('a');a.setAttribute('href',m[1]);a.textContent=m[2]})()</script>
{% endblock %}
