{% if it.tags_items or it.tags_events or it.tags_regions %}<div class="tags">{% for t in it.tags_items %}<a class="coin" href="news.html?tag={{ t|urlencode }}"><i>{{ t[0] }}</i>{{ t }}</a>{% endfor %}{% for t in it.tags_events %}<a class="coin ev" href="news.html?tag={{ t|urlencode }}"><i>#</i>{{ t[1:] }}</a>{% endfor %}{% for t in it.tags_regions %}<a class="coin rg" href="news.html?tag={{ t|urlencode }}"><i>{{ t[0] }}</i>{{ t }}</a>{% endfor %}</div>{% endif %}
